# Пример Nginx reverse proxy для LandMark (вариант развертывания на VPS).
# Наружу открывается только порт 80/443, внутрь проксируется API Gateway (8080).
# Файл кладётся в /etc/nginx/sites-available/landmark.conf и включается симлинком.

server {
    listen 80;
    server_name example.com;

    # API Gateway — единственная публичная точка входа
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Медиа из MinIO (presigned URL), если нужно отдавать наружу
    location /media/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
    }
}
