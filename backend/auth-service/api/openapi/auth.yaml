openapi: 3.0.3
info:
  title: Tennis Auth API
  version: 0.1.0
  description: Auth endpoints (subset for contract tests; extend as the module grows).

servers:
  - url: /
    description: Current API host (recommended for Try it out)

paths:
  /healthz:
    get:
      summary: Liveness / readiness
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Dependency unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/auth/phone/code:
    post:
      operationId: phoneRequestCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneCodeRequest"
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit:
              schema: { type: string }
            X-RateLimit-Remaining:
              schema: { type: string }
            X-RateLimit-Reset:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneCodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/phone/verify:
    post:
      operationId: phoneVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneVerifyRequest"
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit:
              schema: { type: string }
            X-RateLimit-Remaining:
              schema: { type: string }
            X-RateLimit-Reset:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/login:
    post:
      operationId: loginPassword
      summary: Login with verified email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit:
              schema: { type: string }
            X-RateLimit-Remaining:
              schema: { type: string }
            X-RateLimit-Reset:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/me:
    get:
      operationId: me
      summary: Current user from access token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/me/email:
    post:
      operationId: startEmailVerification
      summary: Start email bind; sends OTP. Returns verification_id for verify-email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailBindRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailBindStartedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/me/email/resend:
    post:
      operationId: resendEmailVerification
      summary: Resend email OTP for pending bind
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit:
              schema: { type: string }
            X-RateLimit-Remaining:
              schema: { type: string }
            X-RateLimit-Reset:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailBindStartedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/auth/forgot-password/phone:
    post:
      operationId: forgotPasswordPhone
      summary: Request SMS OTP to reset password (verified phone + existing password only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneCodeRequest"
      responses:
        "200":
          description: OK; verification_id present only when SMS was sent
          headers:
            X-RateLimit-Limit:
              schema: { type: string }
            X-RateLimit-Remaining:
              schema: { type: string }
            X-RateLimit-Reset:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordPhoneResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/reset-password/phone:
    post:
      operationId: resetPasswordPhone
      summary: Confirm SMS and set new password (no session issued)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordPhoneRequest"
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit:
              schema: { type: string }
            X-RateLimit-Remaining:
              schema: { type: string }
            X-RateLimit-Reset:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        db:
          type: string
        redis:
          type: string

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string

    StatusOK:
      type: object
      required: [status]
      properties:
        status:
          type: string

    PhoneCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: International or local phone number
          example: "+79991234567"
        region:
          type: string
          description: Default region for parsing (e.g. RU) when the number is local
          example: "RU"

    PhoneCodeResponse:
      type: object
      required: [verification_id]
      properties:
        verification_id:
          type: string
          format: uuid

    PhoneVerifyRequest:
      type: object
      required: [verification_id, code]
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
        device_id:
          type: string
        device_name:
          type: string
        platform:
          type: string

    ForgotPasswordPhoneResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        verification_id:
          type: string
          format: uuid
          description: Present only when an SMS OTP was sent to an eligible account

    ResetPasswordPhoneRequest:
      type: object
      required: [verification_id, code, new_password]
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
        new_password:
          type: string
          minLength: 10
          maxLength: 128

    TokenResponse:
      type: object
      required: [access_token, refresh_token, expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string

    MeResponse:
      type: object
      required: [user_id, session_id, role, has_password, email_verified, phone_verified]
      properties:
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          type: string
        has_password:
          type: boolean
        email_verified:
          type: boolean
        phone_verified:
          type: boolean
        email:
          type: string
          nullable: true
        phone_e164:
          type: string
          nullable: true

    VerifyEmailRequest:
      type: object
      required: [verification_id, code]
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        device_id:
          type: string
        device_name:
          type: string
        platform:
          type: string

    EmailBindRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    EmailBindStartedResponse:
      type: object
      required: [status, verification_id]
      properties:
        status:
          type: string
          example: ok
        verification_id:
          type: string
          format: uuid
